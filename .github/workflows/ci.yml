name: CI and release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore GHubBatteryTray.slnx
      - run: dotnet test GHubBatteryTray.slnx --configuration Release --no-restore

  package:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid:
          - win-x64
          - win-x86
          - win-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish ${{ matrix.rid }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RID: ${{ matrix.rid }}
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          dotnet publish src/GHubBatteryTray/GHubBatteryTray.csproj `
            --configuration Release `
            --runtime $env:RID `
            --self-contained true `
            -p:Version=$version `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:DebugSymbols=false `
            -p:DebugType=None `
            --output "artifacts/$env:RID"
          Rename-Item `
            -LiteralPath "artifacts/$env:RID/GHubBatteryTray.exe" `
            -NewName "GHubBatteryTray-$env:RELEASE_TAG-$env:RID.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/${{ matrix.rid }}/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Create checksums
        working-directory: release
        run: sha256sum *.exe > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
